[project]
name = "yolo-agent"
version = "0.1.0"
description = "Yolo检测的智能化Agent项目"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.15",
    "langchain-openai>=1.1.16",
    "langgraph>=1.0.2",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "python-multipart>=0.0.20",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
